appId: dev.dukou.relay-chat-demo
productName: Relay Chat Demo
copyright: Copyright © 2026 Cheng Lei

directories:
  buildResources: build
  output: release

files:
  - dist/**
  - electron/**
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Relay-Chat-Demo-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  extendInfo:
    CFBundleDisplayName: Relay Chat Demo
    CFBundleName: Relay Chat Demo
    NSHumanReadableCopyright: Copyright © 2026 Cheng Lei
    LSApplicationCategoryType: public.app-category.productivity

dmg:
  title: Relay Chat Demo ${version}
  iconSize: 96
  window:
    width: 560
    height: 360
  contents:
    - x: 160
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
